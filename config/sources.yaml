# Fuentes de relevamiento, organizadas por cuadrante STEEP.
# La guía de la cátedra exige un mínimo de 5 fuentes por cuadrante.
#
# `owner` agrupa fuentes que pertenecen al mismo grupo editorial o institución:
# el diagnóstico de diversidad cuenta owners, no feeds ("diez feeds del mismo
# grupo mediático son una fuente").
#
# `feed_status` lo completa scripts/validate_feeds.py — no editar a mano.

