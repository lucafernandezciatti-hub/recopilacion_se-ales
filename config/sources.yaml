# Términos de búsqueda para alimentar el relevamiento cuando no hay feed.
search_queries:
  core:
    - "alfabetización inicial Argentina resultados"
    - "comprensión lectora tercer grado Argentina"
    - "pruebas Aprender resultados primaria"
    - "trayectorias escolares abandono primaria Argentina"
    - "formación docente reforma Argentina"
    - "jornada extendida escuela primaria Argentina"
    - "financiamiento educativo provincias Argentina"
    - "infraestructura escolar conectividad Argentina"
  adjacent:
    - "caída natalidad Argentina matrícula escolar"
    - "inteligencia artificial docentes aula"
    - "prohibición celulares escuelas"
    - "pobreza infantil Argentina indicadores"
    - "escuelas rurales cierre despoblamiento"
    - "olas de calor suspensión de clases escuelas"
    - "migración escuela privada Argentina matrícula"
    - "privacidad datos niños plataformas educativas"
    - "homeschooling educación en casa regulación"
    - "primera infancia desarrollo cognitivo políticas"
